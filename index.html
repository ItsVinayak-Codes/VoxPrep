    const API_BASE_URL = "http://localhost:8000";

    function App() {
      // Theme State ('dark' | 'light')
      const [theme, setTheme] = useState('dark');

      // Navigation & View State ('welcome' | 'interview')
      const [page, setPage] = useState('welcome');
      const [showRegistrationModal, setShowRegistrationModal] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);

      // Candidate Profile State
      const [candidate, setCandidate] = useState({
        name: '',
        role: '',
        company: '',
        exp: 'Mid-Level',
        type: 'Mixed Assessment'
      });

      // API Key States
      const [mistralApiKey, setMistralApiKey] = useState('');
      const [rimeApiKey, setRimeApiKey] = useState('');

      // Chat & Session State
      const [chatMessages, setChatMessages] = useState([]);
      const [chatHistory, setChatHistory] = useState([]);
      const [evaluations, setEvaluations] = useState([]);
      const [sessionState, setSessionState] = useState('WELCOME_CONFIRMATION');
      const [questionCount, setQuestionCount] = useState(0);
      const [targetTotalQuestions, setTargetTotalQuestions] = useState(8);
      const [inputValue, setInputValue] = useState('');

      // Voice & Accessibility Controls
      const [isVoiceOutputEnabled, setIsVoiceOutputEnabled] = useState(true);
      const [isListening, setIsListening] = useState(false);
      const [showVirtualKeyboard, setShowVirtualKeyboard] = useState(false);
      const [voiceError, setVoiceError] = useState('');

      // Synchronous State References & Audio
      const isVoiceOutputEnabledRef = useRef(isVoiceOutputEnabled);
      const chatMessagesEndRef = useRef(null);
      const textareaRef = useRef(null);
      const audioContextRef = useRef(null);
      const currentAudioSourceRef = useRef(null);
      const recognitionRef = useRef(null);
      const hasTriggeredScrollPopupRef = useRef(false);
      const lastScrollYRef = useRef(0);

      // Hoisted Audio Helper Definitions
      const ensureAudioContextUnlocked = useCallback(() => {
        if (!audioContextRef.current) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            audioContextRef.current = new AudioCtx();
          }
        }
        if (audioContextRef.current && audioContextRef.current.state === 'suspended') {
          audioContextRef.current.resume().catch(() => {});
        }
      }, []);

      const stopVoiceOutput = useCallback(() => {
        if (currentAudioSourceRef.current) {
          try {
            if (typeof currentAudioSourceRef.current.stop === 'function') {
              currentAudioSourceRef.current.stop();
            } else if (typeof currentAudioSourceRef.current.pause === 'function') {
              currentAudioSourceRef.current.pause();
              currentAudioSourceRef.current.currentTime = 0;
            }
          } catch (e) {}
          currentAudioSourceRef.current = null;
        }
        if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
          } catch (e) {}
        }
      }, []);

      const toggleVoiceOutput = useCallback(() => {
        ensureAudioContextUnlocked();
        setIsVoiceOutputEnabled(prev => {
          const nextState = !prev;
          if (!nextState) {
            stopVoiceOutput();
          }
          return nextState;
        });
      }, [ensureAudioContextUnlocked, stopVoiceOutput]);

      useEffect(() => {
        isVoiceOutputEnabledRef.current = isVoiceOutputEnabled;
      }, [isVoiceOutputEnabled]);

      useEffect(() => {
        const handleScroll = () => {
          const currentScrollY = window.scrollY;
          if (
            currentScrollY > 350 &&
            currentScrollY < lastScrollYRef.current &&
            !hasTriggeredScrollPopupRef.current &&
            !candidate.name &&
            page === 'welcome'
          ) {
            setShowRegistrationModal(true);
            hasTriggeredScrollPopupRef.current = true;
          }
          lastScrollYRef.current = currentScrollY;
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, [candidate.name, page]);

      useEffect(() => {
        chatMessagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages]);

      const speakText = useCallback(async (text) => {
        if (!isVoiceOutputEnabledRef.current || !text) return;

        ensureAudioContextUnlocked();

        // 1. Rime AI Text-to-Speech API Direct Integration
        if (rimeApiKey) {
          try {
            const response = await fetch("https://users.rime.ai/v1/rime-tts", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${rimeApiKey.trim()}`,
                "Content-Type": "application/json",
                "Accept": "audio/mpeg"
              },
              body: JSON.stringify({
                speaker: "astra",
                text: text,
                modelId: "mistv2",
                lang: "en"
              })
            });

            if (response.ok) {
              const audioBlob = await response.blob();
              const audioUrl = URL.createObjectURL(audioBlob);
              stopVoiceOutput();
              const audio = new Audio(audioUrl);
              currentAudioSourceRef.current = audio;
              audio.play();
              return;
            }
          } catch (e) {
            console.warn("Rime AI TTS error, falling back to WebSpeech:", e);
          }
        }

        // 2. WebSpeech API Speech Synthesis Fallback
        if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            const voices = window.speechSynthesis.getVoices();
            if (voices && voices.length > 0) {
              const prefVoice = voices.find(v => v.lang && v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Daniel'))) || voices.find(v => v.lang && v.lang.startsWith('en'));
              if (prefVoice) utterance.voice = prefVoice;
            }

            window.speechSynthesis.speak(utterance);
          } catch (e) {
            console.error("WebSpeech error:", e);
          }
        }
      }, [rimeApiKey, ensureAudioContextUnlocked, stopVoiceOutput]);

      const handleVkPress = (char) => {
        const input = textareaRef.current;
        if (!input) return;

        input.focus();
        const start = input.selectionStart !== null ? input.selectionStart : input.value.length;
        const end = input.selectionEnd !== null ? input.selectionEnd : input.value.length;

        if (char === 'Backspace') {
          if (start === end && start > 0) {
            const newValue = inputValue.substring(0, start - 1) + inputValue.substring(end);
            setInputValue(newValue);
            setTimeout(() => input.setSelectionRange(start - 1, start - 1), 0);
          } else {
            const newValue = inputValue.substring(0, start) + inputValue.substring(end);
            setInputValue(newValue);
            setTimeout(() => input.setSelectionRange(start, start), 0);
          }
        } else {
          const newValue = inputValue.substring(0, start) + char + inputValue.substring(end);
          setInputValue(newValue);
          setTimeout(() => input.setSelectionRange(start + char.length, start + char.length), 0);
        }
      };

      const toggleVoiceInput = async () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setVoiceError("Speech recognition is not supported on this browser. Please type your response.");
          return;
        }

        if (isListening) {
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch (e) {}
          }
          setIsListening(false);
          return;
        }

        try {
          setVoiceError('');
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            await navigator.mediaDevices.getUserMedia({ audio: true });
          }

          const recognition = new SpeechRecognition();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.lang = 'en-US';

          recognition.onstart = () => setIsListening(true);
          recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              transcript += event.results[i][0].transcript;
            }
            if (transcript) setInputValue(transcript);
          };
          recognition.onerror = (e) => {
            console.warn("Speech recognition error:", e.error);
            setIsListening(false);
            if (e.error === 'not-allowed') {
              setVoiceError("Microphone access denied. Please allow microphone permissions in browser settings.");
            } else if (e.error !== 'no-speech') {
              setVoiceError(`Voice dictation error: ${e.error}`);
            }
          };
          recognition.onend = () => setIsListening(false);

          recognitionRef.current = recognition;
          recognition.start();
        } catch (err) {
          console.error("Microphone permission or start error:", err);
          setIsListening(false);
          setVoiceError("Unable to access microphone. Please check your microphone permissions.");
        }
      };

      const handleStartInterviewSubmit = (e) => {
        e.preventDefault();
        ensureAudioContextUnlocked();
        setShowRegistrationModal(false);
        setPage('interview');

        // Reset Chat State
        setChatMessages([]);
        setChatHistory([]);
        setEvaluations([]);
        setQuestionCount(0);
        setTargetTotalQuestions(8);
        setSessionState('WELCOME_CONFIRMATION');

        // Deliver Initial Welcome Message
        const welcomeText = `Hello ${candidate.name}! Welcome to your VoxPrep AI interview session for the ${candidate.role} position at ${candidate.company || 'Target Company'}. Are you ready to begin? Please confirm whenever you are set to start.`;
        
        const initialMsg = {
          id: 'msg_' + Date.now(),
          sender: 'interviewer',
          text: welcomeText,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setChatMessages([initialMsg]);
        setChatHistory([{ role: 'model', parts: [{ text: welcomeText }] }]);

        if (isVoiceOutputEnabled) {
          speakText(welcomeText);
        }
      };

      const startNextQuestion = async (currentHistory, currentQCount, currentEvals) => {
        const nextQCount = currentQCount + 1;
        setQuestionCount(nextQCount);

        let newTarget = 8;
        if (currentEvals.length >= 3) {
          let total = 0;
          currentEvals.forEach(e => {
            total += ((Number(e.techScore) || 7) + (Number(e.clarityScore) || 7) + (Number(e.relScore) || 7)) / 3;
          });
          const avg = total / currentEvals.length;
          if (avg >= 8.0) newTarget = 10;
          else if (avg >= 6.5) newTarget = 9;
          else newTarget = 8;
        }
        setTargetTotalQuestions(newTarget);

        if (nextQCount > newTarget) {
          setShowReportModal(true);
          return;
        }

        const loadingId = 'loading_' + Date.now();
        setChatMessages(prev => [
          ...prev,
          {
            id: loadingId,
            sender: 'interviewer',
            text: 'VoxPrep AI is formulating your next question with Mistral AI...',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            isLoading: true
          }
        ]);

        const systemPrompt = `You are VoxPrep, an expert hiring manager conducting a concise interview.
Candidate Name: ${candidate.name}
Target Role: ${candidate.role}
Company: ${candidate.company || 'Target Company'}
Experience Level: ${candidate.exp}
Interview Focus: ${candidate.type}
Question Progress: Question ${nextQCount} of ${newTarget}.

CRITICAL INSTRUCTIONS:
1. Ask ONE small, direct, and concise question (1 to 2 sentences MAXIMUM).
2. Keep it crisp, conversational, and focused on practical scenarios or technical concepts.
3. Do NOT ask multi-part questions or write long paragraphs.
4. Avoid markdown bullet lists inside the question text.`;

        const userPrompt = nextQCount === 1
          ? `The candidate ${candidate.name} confirmed they are ready. Ask Question 1 now.`
          : `Candidate just answered question ${nextQCount - 1}. Ask Question ${nextQCount} now.`;

        try {
          // 1. Mistral AI Chat Completions API
          if (mistralApiKey) {
            const messages = [
              { role: 'system', content: systemPrompt },
              ...currentHistory.map(h => ({
                role: h.role === 'model' ? 'assistant' : 'user',
                content: h.parts?.[0]?.text || ''
              })),
              { role: 'user', content: userPrompt }
            ];

            const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${mistralApiKey.trim()}`
              },
              body: JSON.stringify({

Return ONLY a valid JSON object with exact keys:
